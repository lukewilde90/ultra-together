<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ultra Together</title>
    <script>
      // GitHub Pages SPA routing fix
      // Stores the full URL in sessionStorage then redirects to index.html
      // index.html reads this and restores the correct route via history.replaceState
      var pathSegmentsToKeep = 1; // set to 0 for custom domains, 1 for username.github.io/repo

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
