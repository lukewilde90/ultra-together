<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ultra Together</title>
    <script>
      // GitHub Pages SPA routing fix.
      // When GitHub Pages gets a request for a deep URL like /ultra-together/dashboard,
      // it returns a 404. This page catches that, stores the intended URL in
      // sessionStorage, then redirects to the root index.html which restores it.
      var l = window.location;
      sessionStorage.redirect = l.href;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 2).join('/') + '/?p=1');
    </script>
  </head>
  <body></body>
</html>
